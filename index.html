<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers; without it the bottom tab bar sits under the iPhone home
         indicator and the status bar overlaps the header. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA manifest + theme color -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F1117" />

    <!-- Standard installable-app hint. Keep the apple- prefixed one below too:
         older iOS Safari still only understands that spelling. -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple-specific PWA hints (so iOS Safari "Add to Home Screen" works well) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>Portfolio Dashboard · FIRE Tracker</title>
    <script>
      // Apply theme before React mounts to prevent flash on reload
      try {
        const stored = JSON.parse(localStorage.getItem('portfolio-dashboard-v1'));
        const theme = stored?.state?.settings?.theme || 'dark';
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(theme);
      } catch (e) { /* default already applied */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register service worker for PWA install + faster repeat loads.
         Skipped during dev to avoid stale cache issues. -->
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // service worker registration failed — silently ignore
          });
        });
      }
    </script>
  </body>
</html>
